name: Orbio Guard CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_implementation/orbio-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 03_implementation/orbio-guard/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - run: docker build -t orbio-guard:ci .
